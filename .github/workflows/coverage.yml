name: Coverage

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest-cov coverage coverage-badge setuptools

      - name: Run tests with coverage
        run: pytest tests/ --cov=. --cov-report=term-missing --cov-report=xml -q

      - name: Generate coverage badge
        run: coverage-badge -o coverage.svg -f

      - name: Commit coverage badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add coverage.svg
          if git diff --cached --quiet; then
            echo "No coverage badge changes"
          else
            git commit -m "Update coverage badge [skip ci]"
            git push
          fi
