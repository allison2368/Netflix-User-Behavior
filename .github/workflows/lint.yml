name: Lint

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: "Get Python files to lint (PR: only changed .py; push: all .py)"
        id: pyfiles
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only --diff-filter=ACMR ${{ github.event.pull_request.base.sha }} HEAD -- '*.py' > changed.txt
          else
            git ls-files '*.py' > changed.txt
          fi
          echo "files<<EOF" >> $GITHUB_OUTPUT
          cat changed.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Run pylint
        env:
          PYTHONPATH: .
        run: |
          FILES="${{ steps.pyfiles.outputs.files }}"
          if [ -n "$FILES" ]; then
            echo "$FILES" | xargs pylint
          else
            echo "No Python files to lint (PR has no changed .py files)"
          fi

      - name: Run tests
        run: pytest tests/
