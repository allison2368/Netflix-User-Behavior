[project]
name = "netflix-user-behavior"
version = "0.1.0"
description = "Netflix user behavior analytics and churn dashboards"
readme = "README.md"
requires-python = ">=3.14"

[tool.pylint.MASTER]
# Add project root to path so "churn_model" imports resolve when running pylint from repo root
#init-hook = "import sys, os; sys.path.insert(0, os.getcwd())"
init-hook = "import sys; from pathlib import Path; sys.path.append(str(Path.cwd()))"

[tool.pylint.MAIN]
source-roots = ["."]
